# Les tests tournent à chaque push : un commit rouge se voit sur GitHub
# avant de finir dans un paquet envoyé au Store.
name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
